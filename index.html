    <meta charset="UTF-8" />

    <meta name="description" content="Яркий 2D-платформер с удобным визуальным редактором уровней, плавной физикой, четырьмя красочными мирами и настраиваемыми героями." />
    <meta property="og:title" content="SUPER PIXEL WORLD — Конструктор Уровней" />

    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      (function() {
        try {
          var _origFetch = typeof window !== 'undefined' && window.fetch ? window.fetch.bind(window) : undefined;
          var _customFetch = _origFetch;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return _customFetch;
            },
            set: function(val) {
              _customFetch = val;
            },
            configurable: true,
            enumerable: true
          });
        } catch (err) {}

        window.addEventListener('error', function(event) {
          if (event && event.filename && (event.filename.indexOf('chrome-extension://') !== -1 || event.filename.indexOf('moz-extension://') !== -1)) {
            event.stopImmediatePropagation();
            event.preventDefault();
          }
        }, true);
      })();
    </script>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
